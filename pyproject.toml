[project]
name = "minibadge-designer"
version = "0.1.0"
description = "Web UI that turns a logo + LED picks into a fab-ready SAINTCON minibadge KiCad project."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "fonttools>=4.50",
    "pillow>=10.0",
    "shapely>=2.0",
    "svgelements>=1.9",
]

[project.optional-dependencies]
# Development and test tooling: pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
minibadge-designer = "minibadge_designer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["minibadge_designer*"]

[tool.setuptools.package-data]
minibadge_designer = ["templates/*", "fonts/*"]
