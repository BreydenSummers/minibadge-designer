[project]
name = "badge-maker"
version = "0.1.0"
description = "One sentence on what badge-maker does."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Development and test tooling: pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
badge-maker = "badge_maker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["badge_maker*"]
