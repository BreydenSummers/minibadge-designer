# Temporary: reports what the self-hosted runner can actually see and do, so
# the deploy workflow can be written against facts instead of guesses.
# Delete this file once deploy.yml is settled.
name: Runner preflight

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    env:
      DEPLOY_DIR: /opt/minibadge-designer
      GIT_TERMINAL_PROMPT: "0"
      GIT_SSH_COMMAND: "ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
    steps:
      - name: Who and where
        run: |
          echo "user:      $(whoami)  ($(id))"
          echo "workspace: $GITHUB_WORKSPACE"
          echo "runner:    $RUNNER_NAME  os=$RUNNER_OS arch=$RUNNER_ARCH"
          echo "cpus:      $(nproc)   mem: $(free -h | awk '/^Mem:/{print $2}')"
          echo "disk /:    $(df -h / | awk 'NR==2{print $4" free"}')"
          echo "disk /opt: $(df -h /opt | awk 'NR==2{print $4" free"}')"

      - name: Docker access
        run: |
          docker version --format '{{.Server.Version}}' && echo "docker: OK"
          docker compose version || echo "docker compose plugin: MISSING"
          docker ps --format '{{.Names}}\t{{.Status}}\t{{.Ports}}' || true

      - name: Deploy directory
        run: |
          ls -la /opt | sed -n '1,20p'
          echo "--- $DEPLOY_DIR"
          if [ -d "$DEPLOY_DIR" ]; then
            ls -la "$DEPLOY_DIR" | sed -n '1,30p'
            echo "writable: $([ -w "$DEPLOY_DIR" ] && echo yes || echo NO)"
            echo ".env present: $([ -f "$DEPLOY_DIR/.env" ] && echo yes || echo no)"
          else
            echo "MISSING"
          fi

      - name: Git state and pull credentials in the deploy directory
        run: |
          cd "$DEPLOY_DIR" || exit 0
          git remote -v || true
          git status -sb || true
          git log --oneline -1 || true
          echo "--- can this user fetch from origin?"
          if timeout 30 git ls-remote origin HEAD >/dev/null 2>&1; then
            echo "fetch: OK with the credentials already on the box"
          else
            echo "fetch: FAILS (deploy will authenticate with the workflow token)"
          fi

      - name: Compose stack as the deploy directory sees it
        run: |
          cd "$DEPLOY_DIR" 2>/dev/null || exit 0
          docker compose ps --format '{{.Name}}\t{{.Status}}\t{{.Ports}}' || true
