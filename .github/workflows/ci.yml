# CI for the working branch. Runs on a GitHub-hosted runner, deliberately not
# on the self-hosted `badge` runner that serves the site.
#
# It used to run there, to share a Docker layer cache with deploy.yml. The
# trade for that convenience was bad: a self-hosted runner executes whatever
# the checked-out commit says to execute, the build step runs the commit's own
# Dockerfile, the test step runs the commit's own test suite, and the runner
# user is in the `docker` group -- which is root-equivalent on the host. Any
# commit that reached CI therefore had a path to code execution on the
# production box, without ever passing through deploy.yml. A throwaway VM
# removes that path outright: the only thing that now runs on `badge` is
# deploy.yml, on push to main.
#
# What was given up is the warm cache. Deploys still reuse the layers left by
# the previous deploy, so this only costs time when a change lands early in the
# Dockerfile (requirements.lock, the apt stages).
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Hosted runners are not a shared queue, so this is only about not spending
# minutes on a superseded dev push. Deploys use a different group and are
# never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Fork pull requests are still skipped rather than run. On a hosted runner
    # this is no longer load-bearing -- the VM is disposable, the token is
    # read-only, and no secrets are exposed to it -- so it is now a choice
    # rather than a necessity. Dropping this `if:` to let fork PRs build and
    # test themselves would be a reasonable change; it is kept for now so that
    # unreviewed code does not consume the account's runner minutes.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: minibadge-designer:ci-${{ github.sha }}

    steps:
      # Pinned to the commit v7.0.1 points at, not to the `v7` tag: a tag is
      # mutable, so `v7` is a promise by a third party about what will run
      # here. v4 declared node20, which the runner no longer ships; it was
      # already being forced onto node24 and warning about it. node24 has been
      # declared since v5, so any v5+ pin silences that -- v7 is simply the
      # current major.
      #
      # persist-credentials: false because nothing after this step talks to
      # git: the build and the test suite only read the tree. No reason to
      # leave a usable token sitting in the workspace the Dockerfile copies
      # from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Not just a build: the last stage exports a two-LED board and fails if
      # the 3D models did not resolve or lost their colours, which is the one
      # class of breakage that otherwise ships silently (see the Dockerfile).
      #
      # Cold every time now that the cache is not shared with the deploy host.
      # Measured at ~80s on ubuntu-24.04, because the expensive part -- the
      # models stage unpacking Debian's full kicad-packages3d tree to keep half
      # a megabyte of it -- is bounded by that runner's apt mirror and disk,
      # both of which are fast.
      - name: Build the image
        run: docker build -t "$IMAGE" .

      # Tests run *inside* the image so they get the same kicad-cli and the
      # same build-time assets (typefaces, model-viewer) the container serves
      # with. --strict-tools turns "kicad is missing" into a failure instead of
      # a green run full of skips. The browser tier is excluded: no Chromium in
      # this image, and installing one per run costs more than it is worth.
      #
      # Runs as `badge`, the image's own unprivileged user, not as root. This
      # used to be --user root on the theory that the editable install needs to
      # write to /app and to site-packages -- but --cap-drop ALL takes
      # CAP_DAC_OVERRIDE, which is the only reason uid 0 could write into a
      # badge-owned /app in the first place, so root got a plain "Permission
      # denied" on minibadge_designer.egg-info and the step never ran a test.
      #
      # As badge the two writes land where badge already has permission: /app
      # is badge-owned (so .egg-info, .pytest_cache and .hypothesis are fine),
      # and --user sends the dev tooling to ~/.local instead of system
      # site-packages. That needs no capability back, so ALL stays dropped. The
      # tooling is invoked as `python3 -m pytest` because ~/.local/bin is not
      # on PATH.
      - name: Test suite
        run: |
          docker run --rm --user badge --workdir /app \
            --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 512 --memory 4g \
            -e HOME=/home/badge -e PIP_DISABLE_PIP_VERSION_CHECK=1 \
            "$IMAGE" bash -c '
              pip install --quiet --no-cache-dir --break-system-packages \
                --user --no-warn-script-location -e ".[dev]" &&
              python3 -m pytest --strict-tools -m "not visual and not browser" -q'
