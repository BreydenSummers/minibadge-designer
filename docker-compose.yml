# Container/network names stay stable regardless of the checkout directory.
name: minibadge-designer

services:
  minibadge-designer:
    build: .
    # Optional local overrides: the app has no required configuration, so a
    # missing .env must not stop the stack from coming up.
    env_file:
      - path: .env
        required: false
    # Loopback only: the published port is reachable from this machine, not
    # from the network. Drop the "127.0.0.1:" prefix (or set it to a specific
    # interface) to deliberately serve other people on the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

    # ---- logs ---------------------------------------------------------------
    # Two places, two purposes. `docker compose logs` has everything (the
    # access log on stdout, gunicorn and the app's failure lines on stderr),
    # capped here so a scanner hammering the site cannot fill the disk under
    # Docker's default unbounded json-file. ./logs/errors.log on the host is
    # the *errors only* subset -- one line per refused or failed request, with
    # the cause the user was not shown, plus worker timeouts -- for tailing and
    # grepping without Docker (see gunicorn.conf.py). It defaults to the
    # checkout's own logs/ because that directory exists on every machine that
    # has the code and is owned by whoever cloned it; set LOG_DIR in .env to
    # put it somewhere else (/var/log/minibadge, say). The container writes as
    # uid 1000: if the directory belongs to another uid the container still
    # starts, says so once on stderr, and keeps the errors on stderr only --
    # `chown 1000 <dir>` on the host fixes it. Rotation of the file is the
    # host's job (logrotate stanza in the README); it grows by the incident.
    environment:
      LOG_DIR: /var/log/minibadge   # the path *inside* the container, fixed
    volumes:
      - ${LOG_DIR:-./logs}:/var/log/minibadge
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # ---- resource ceilings ------------------------------------------------
    # Not tuning: containment. Every endpoint here is unauthenticated and
    # every one of them decodes a file the caller chose, so "how much of this
    # machine can one upload spend" has to have an answer other than "all of
    # it". It matters more than usual because of what shares the box: the
    # GitHub runner that deploys this app and the reverse proxy that fronts it
    # both live here, so an OOM triggered from the internet would take down the
    # site, the proxy, and the thing that could redeploy either.
    #
    # 3 GB across 4 gunicorn workers is roughly 4x their steady ~100 MB plus
    # headroom for the heaviest legitimate board. Over it, the kernel kills one
    # worker and gunicorn starts a replacement; the alternative is the host's
    # OOM killer choosing, and it does not know which process is the website.
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
          # kicad-cli forks; runaway process creation should not be able to
          # exhaust the host's process table. (Set here rather than as the
          # top-level `pids_limit`, which compose rejects as a duplicate.)
          pids: 512
    security_opt:
      - "no-new-privileges:true"
    # Nothing in the image is written at runtime: the app reads its own
    # package, and every request builds its own TemporaryDirectory. The three
    # tmpfs below are the paths that genuinely need to be writable --
    # /tmp for those directories, /dev/shm for gunicorn's worker heartbeat
    # (see gunicorn.conf.py), and /home/badge because kicad-cli insists on
    # writing a config file into HOME before it will export anything.
    read_only: true
    tmpfs:
      - /tmp
      - /dev/shm:size=64m
      - /home/badge:uid=1000,gid=1000

    # No curl in the image; the interpreter is already there.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read(1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
