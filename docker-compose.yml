# Container/network names stay stable regardless of the checkout directory.
name: minibadge-designer

services:
  minibadge-designer:
    build: .
    # Optional local overrides: the app has no required configuration, so a
    # missing .env must not stop the stack from coming up.
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    restart: unless-stopped
    # No curl in the image; the interpreter is already there.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read(1)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
